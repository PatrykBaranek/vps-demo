services:
  next-standalone:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN-}
    image: nextjs-standalone-image
    container_name: nextjs-standalone-container
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "3000:3000"
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./app
        - action: rebuild
          path: ./components
        - action: rebuild
          path: ./lib
        - action: rebuild
          path: ./public
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./next.config.ts
        - action: rebuild
          path: ./instrumentation.ts
        - action: rebuild
          path: ./instrumentation-client.ts
        - action: rebuild
          path: ./sentry.server.config.ts
        - action: rebuild
          path: ./sentry.edge.config.ts
        - action: rebuild
          path: ./postcss.config.mjs
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./components.json
        - action: rebuild
          path: ./Dockerfile
