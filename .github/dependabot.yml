version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Give new releases a few days to be yanked/flagged before proposing them.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      # Minor and patch bumps land in one PR; majors get their own PRs.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Stay on the Node.js LTS line the Dockerfile pins; move majors by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope
